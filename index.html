<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OldSkool.fm</title>
<meta name="description" content="80s, 90s and 2000s Bollywood love songs, nonstop. Free, no login.">
<meta name="theme-color" content="#140C26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Romantic night radio. Dusk sky + drifting bokeh behind frosted glass. Vinyl player left, stations + songs right. Single committed dark look. */
:root{
  --night:#140C26; --plum:#3A1747; --rose:#FF6F91; --blush:#FFC2D1; --gold:#FFD7A3;
  --text:#FFF4F7; --muted:rgba(255,228,236,.64); --faint:rgba(255,228,236,.38);
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --line:rgba(255,255,255,.13);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blush);outline-offset:3px;border-radius:8px}

/* Background */
.sky{position:fixed;inset:0;z-index:-3;
  background:
   radial-gradient(60% 50% at 15% 10%,rgba(255,111,145,.45),transparent 70%),
   radial-gradient(50% 45% at 90% 25%,rgba(155,89,255,.35),transparent 70%),
   radial-gradient(70% 60% at 50% 110%,rgba(255,170,120,.30),transparent 70%),
   linear-gradient(180deg,#1A0F33 0%,#2A1240 45%,#160B29 100%)}
#bokeh{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.logo{font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:-.01em}
.logo i{color:var(--rose)}
.live{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.live b{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.playing .live b{background:var(--rose);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,145,.7)}70%{box-shadow:0 0 0 8px rgba(255,111,145,0)}100%{box-shadow:0 0 0 0 rgba(255,111,145,0)}}

.app{display:grid;grid-template-columns:400px minmax(0,1fr);gap:40px;align-items:start;padding-block:8px 48px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 30px 80px -40px rgba(0,0,0,.7)}

/* Player */
.player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);padding:28px 26px 24px;text-align:center;overflow:hidden}
.vinyl-wrap{position:relative;width:min(280px,66vw);aspect-ratio:1;margin:4px auto 0}
.vinyl{position:absolute;inset:0;border-radius:50%;
  background:
   radial-gradient(circle,transparent 0 31%,rgba(255,255,255,.05) 31.5%,transparent 32%),
   repeating-radial-gradient(circle,#141018 0 1.2px,#1d1822 1.6px 2.6px),
   #111;
  box-shadow:0 25px 60px -20px rgba(0,0,0,.8),0 0 0 6px rgba(255,255,255,.04),0 0 80px -10px rgba(255,111,145,.35);
  animation:spin 6s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 55%,rgba(255,255,255,.08) 60%,transparent 66%)}
.label{position:absolute;inset:31%;border-radius:50%;background:var(--rose) center/cover;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.label::after{content:"";position:absolute;left:50%;top:50%;width:10%;height:10%;margin:-5% 0 0 -5%;border-radius:50%;background:var(--night);box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;right:-4%;top:-6%;width:34%;height:62%;transform-origin:78% 10%;transform:rotate(-24deg);transition:transform .8s cubic-bezier(.3,.7,.3,1);pointer-events:none}
.playing .arm{transform:rotate(0deg)}
.arm svg{width:100%;height:100%;overflow:visible}

.np-station{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blush)}
.np-title{font-family:var(--serif);font-size:32px;line-height:1.08;margin:8px 0 4px;letter-spacing:-.01em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.08em}
.np-artist{color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.progress{margin-top:22px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;margin:0;cursor:pointer;
  background:linear-gradient(90deg,var(--rose),var(--gold)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.14)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,111,145,.25)}
.range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums}

.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ib{background:none;border:0;padding:10px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .15s,color .15s,transform .15s}
.ib:hover{background:var(--glass-2)}
.ib svg{width:22px;height:22px}
.ib.sm svg{width:19px;height:19px}
.ib.dim{color:var(--muted)}
.ib.on{color:var(--rose)}
.pp{width:68px;height:68px;background:linear-gradient(135deg,var(--rose),#FF9A8B);color:#2A0E1C;box-shadow:0 12px 30px -8px rgba(255,111,145,.7)}
.pp:hover{background:linear-gradient(135deg,var(--rose),#FF9A8B);transform:scale(1.05)}
.pp svg{width:26px;height:26px}
.extra{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--muted)}
.extra svg{width:16px;height:16px;flex:none}
.extra .range{flex:1}

/* Right side */
.side{min-width:0}
.hello{margin:4px 0 22px}
.hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.6vw,68px);line-height:1;margin:0;letter-spacing:-.015em;text-wrap:balance}
.hello h1 i{color:var(--blush)}
.hello p{margin:12px 0 0;color:var(--muted);max-width:46ch}
.stations{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--text);background:var(--glass-2)}
.chip[aria-pressed="true"]{background:#fff;color:#2A0E1C;border-color:#fff}
.songs{padding:10px}
.songs-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 10px}
.songs-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1}
.songs-head span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
ol.list{list-style:none;margin:0;padding:0;max-height:min(62vh,640px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.row{display:grid;grid-template-columns:22px 48px minmax(0,1fr) 40px;gap:14px;align-items:center;padding:8px 10px;border-radius:16px;cursor:pointer;transition:background .15s}
.row:hover{background:var(--glass-2)}
.row .n{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.row .th{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.08) center/180% no-repeat}
.row .ti{min-width:0}
.row .ti b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .heart{color:var(--faint);padding:8px}
.row .heart.on{color:var(--rose)}
.row.cur{background:rgba(255,111,145,.14)}
.row.cur b{color:var(--blush)}
.row.cur .n{color:transparent;position:relative}
.row.cur .n::after{content:"";position:absolute;right:0;top:50%;width:12px;height:12px;margin-top:-6px;
  background:linear-gradient(var(--rose),var(--rose)) 0 100%/3px 40% no-repeat,linear-gradient(var(--rose),var(--rose)) 50% 100%/3px 100% no-repeat,linear-gradient(var(--rose),var(--rose)) 100% 100%/3px 65% no-repeat}
.playing .row.cur .n::after{animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{0%{background-size:3px 30%,3px 90%,3px 55%}50%{background-size:3px 85%,3px 40%,3px 100%}100%{background-size:3px 55%,3px 100%,3px 30%}}
.skel .ti b,.skel .ti span{color:transparent;background:rgba(255,255,255,.08);border-radius:6px;width:70%}
.skel .ti span{width:40%;margin-top:6px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* Audio engine: YouTube player kept off-screen visually */
#engine{position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-5;overflow:hidden}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:rgba(255,255,255,.95);color:#2A0E1C;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--faint);font-size:13px;text-align:center;padding-block:8px 32px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:28px}
  .player{position:static}
  .hello{order:-1;margin-bottom:0}
  .side{display:contents}
  .hello{grid-row:1}
  .player{grid-row:2}
  .stations{grid-row:3;margin:0}
  .songs{grid-row:4}
  ol.list{max-height:none}
}
@media (max-width:480px){
  .row{grid-template-columns:48px minmax(0,1fr) 40px;gap:12px}
  .row .n{display:none}
  .player{padding:24px 18px 20px}
  .np-title{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="sky"></div>
<canvas id="bokeh" aria-hidden="true"></canvas>
<div class="grain"></div>

<header>
  <div class="wrap">
    <div class="logo">OldSkool<i>.fm</i></div>
    <div class="live"><b></b><span id="liveTxt">Tap play</span></div>
  </div>
</header>

<main class="wrap app">
  <section class="glass player" aria-label="Now playing">
    <div class="vinyl-wrap">
      <div class="vinyl"><div class="label" id="art"></div></div>
      <div class="arm" aria-hidden="true">
        <svg viewBox="0 0 100 180" fill="none">
          <circle cx="78" cy="18" r="14" fill="rgba(255,255,255,.18)"/><circle cx="78" cy="18" r="6" fill="#FFD7A3"/>
          <path d="M78 18 L70 120 L46 160" stroke="rgba(255,255,255,.75)" stroke-width="4" stroke-linecap="round"/>
          <rect x="34" y="152" width="22" height="14" rx="3" transform="rotate(-30 45 159)" fill="#FFC2D1"/>
        </svg>
      </div>
    </div>
    <div class="np-station" id="npStation">90s Bollywood</div>
    <h2 class="np-title" id="npTitle">Purane gaane, naya pyaar</h2>
    <p class="np-artist" id="npArtist">Tap play to start</p>

    <div class="progress">
      <input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="ctrls">
      <button class="ib sm dim" id="shuf" type="button" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="ib" id="prev" type="button" aria-label="Previous song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button class="ib pp" id="play" type="button" aria-label="Play"><svg id="ppIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="next" type="button" aria-label="Next song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="ib sm dim" id="likeNow" type="button" aria-label="Like this song" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.1 3.3 4.5 6.9 4.5c2 0 3.5 1.1 5.1 3 1.6-1.9 3.1-3 5.1-3 3.6 0 5.7 3.6 4.1 6.9C19 15.6 12 20 12 20z"/></svg></button>
    </div>
    <div class="extra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input class="range" id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </section>

  <div class="side">
    <div class="hello">
      <h1>Bollywood love songs, <i>all night.</i></h1>
      <p>80s, 90s and 2000s Hindi classics. Pick a mood and press play.</p>
    </div>
    <div class="stations" id="stations" role="group" aria-label="Playlists"></div>
    <section class="glass songs" aria-label="Songs">
      <div class="songs-head"><h2 id="listTitle">Songs</h2><span id="count"></span></div>
      <ol class="list" id="list"></ol>
    </section>
  </div>
</main>
<footer>OldSkool.fm · made for late-night drives and old memories</footer>

<div id="engine"><div id="yt"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================================================================
   PLAYLISTS — public YouTube playlists of Hindi classics.
   To swap one, copy the part after "list=" from a playlist link.
   ================================================================ */
const STATIONS = [
  { key:"90s",   name:"90s Bollywood",      art:"#FF6F91", list:"PLMRKdK25AuPVjHl9Kdb-gkBy0Cm7Zi2xo" },
  { key:"ever",  name:"Evergreen 90s",      art:"#9B59FF", list:"PLqyhv-UBGjwyp1pJCtkf_6ww4WkoIUDaL" },
  { key:"80s",   name:"80s Gold",           art:"#FFB36B", list:"PL08C6kx79n_InNdRv0k-3VVBv1d4VwzPS" },
  { key:"00s",   name:"2000s Nostalgia",    art:"#5EC8FF", list:"PLC6CF5YRxBLBfHmJ9I8RvYXDTHC1Z3gUP" },
  { key:"top25", name:"Top 25 · 2000s",     art:"#FF8FB1", list:"PLMRKdK25AuPVWjRkvga2A58T8wFdCoM3U" },
  { key:"y2k",   name:"Y2K Superhits",      art:"#7FE0C2", list:"PLdHyFLAZY0Mn5YUib9X2XxsS_pOBOIbO1" }
];

/* ================================================================ */
const $=s=>document.getElementById(s);
const store={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const img=(id,q)=>`url(https://i.ytimg.com/vi/${id}/${q||"mqdefault"}.jpg)`;
const ICON={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',
  heart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.1 3.3 4.5 6.9 4.5c2 0 3.5 1.1 5.1 3 1.6-1.9 3.1-3 5.1-3 3.6 0 5.7 3.6 4.1 6.9C19 15.6 12 20 12 20z"/></svg>'};

const titles=store.get("osfm.titles",{});
let liked=store.get("osfm.liked",[]);
let station=null,ids=[],player=null,ready=false,started=false,isPlaying=false,shuffle=false,pending=null,curId="";
const LIKED={key:"liked",name:"♥ Liked",art:"#FF6F91",isLiked:true};
const all=()=>[...STATIONS,LIKED];

/* ---------- UI ---------- */
function renderStations(){
  $("stations").innerHTML=all().map(s=>`<button class="chip" type="button" data-k="${s.key}" aria-pressed="${station&&station.key===s.key}">${s.name}</button>`).join("");
}
function renderList(){
  $("listTitle").textContent=station.isLiked?"Liked songs":station.name;
  if(station.isLiked&&!liked.length){$("count").textContent="";$("list").innerHTML=`<li class="empty">Tap ♥ on any song to keep it here.</li>`;return}
  if(!ids.length){$("count").textContent="LOADING";$("list").innerHTML=Array.from({length:7},()=>`<li class="row skel"><span class="n"></span><span class="th"></span><span class="ti"><b>.</b><span>.</span></span><span></span></li>`).join("");return}
  $("count").textContent=ids.length+" SONGS";
  $("list").innerHTML=ids.map((id,i)=>{const m=titles[id],on=liked.includes(id);
    return `<li class="row${id===curId?" cur":""}${m?"":" skel"}" data-i="${i}" data-id="${id}" tabindex="0">
      <span class="n">${i+1}</span><span class="th" style="background-image:${img(id,"default")}"></span>
      <span class="ti"><b>${m?esc(m.t):"."}</b><span>${m?esc(m.a):"."}</span></span>
      <button class="ib sm heart${on?" on":""}" type="button" data-like="${id}" aria-label="Like" aria-pressed="${on}">${ICON.heart}</button></li>`}).join("");
  fetchTitles();
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function clean(t,a){
  let title=t||"",artist=a||"";
  const parts=title.split(/\s[|•\-–—]\s|\s\|\s?/);
  if(parts.length>1){title=parts[0];artist=parts.slice(1,3).join(" · ")}
  title=title.replace(/\((official|full|lyrical|video|audio|hd|4k)[^)]*\)/ig,"").replace(/\b(full song|full video|lyrical)\b/ig,"").replace(/\s{2,}/g," ").trim();
  artist=artist.replace(/\b(full song|full video|lyrical|hd|4k)\b/ig,"").replace(/\s{2,}/g," ").trim();
  return {t:title||t,a:artist};
}
let fetching=false;
async function fetchTitles(){
  if(fetching)return;fetching=true;
  const todo=ids.filter(id=>!titles[id]);
  for(let k=0;k<todo.length;k+=6){
    await Promise.all(todo.slice(k,k+6).map(async id=>{
      try{const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+id));
        const j=await r.json();if(j.title){titles[id]=clean(j.title,j.author_name);paintRow(id)}}catch(e){}
    }));
    store.set("osfm.titles",titles);
  }
  fetching=false;
}
function paintRow(id){const m=titles[id];document.querySelectorAll(`.row[data-id="${id}"]`).forEach(r=>{r.classList.remove("skel");r.querySelector(".ti b").textContent=m.t;r.querySelector(".ti span").textContent=m.a})}

function showNow(){
  if(!ready||!player.getVideoData)return;
  const d=player.getVideoData();if(!d||!d.video_id)return;
  curId=d.video_id;
  if(!titles[curId]&&d.title){titles[curId]=clean(d.title,d.author);store.set("osfm.titles",titles);paintRow(curId)}
  const m=titles[curId]||{t:d.title,a:d.author};
  $("npTitle").textContent=m.t||"…";$("npArtist").textContent=m.a||"";
  $("art").style.backgroundImage=img(curId,"hqdefault");$("art").style.backgroundSize="180%";
  $("npStation").textContent=station.isLiked?"Liked songs":station.name;
  const on=liked.includes(curId);$("likeNow").classList.toggle("on",on);$("likeNow").setAttribute("aria-pressed",on);
  document.title=`${m.t} · OldSkool.fm`;
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("cur",r.dataset.id===curId));
  const cur=document.querySelector(".row.cur");if(cur&&window.innerWidth>900)cur.scrollIntoView({block:"nearest",behavior:"smooth"});
  if("mediaSession" in navigator&&m.t)navigator.mediaSession.metadata=new MediaMetadata({title:m.t,artist:m.a||"",album:"OldSkool.fm",artwork:[{src:`https://i.ytimg.com/vi/${curId}/hqdefault.jpg`,sizes:"480x360",type:"image/jpeg"}]});
}
function setPlaying(p){
  isPlaying=p;document.body.classList.toggle("playing",p);
  $("liveTxt").textContent=p?"On air":"Paused";
  $("ppIcon").innerHTML=p?ICON.pause:ICON.play;$("play").setAttribute("aria-label",p?"Pause":"Play");
  if("mediaSession" in navigator)navigator.mediaSession.playbackState=p?"playing":"paused";
}

/* ---------- Playback ---------- */
function selectStation(key,autoplay){
  station=all().find(s=>s.key===key)||STATIONS[0];
  store.set("osfm.station",station.key);
  ids=station.isLiked?[...liked]:[];
  renderStations();renderList();
  $("npStation").textContent=station.isLiked?"Liked songs":station.name;
  if(!started){$("art").style.background=station.art}
  load(autoplay);
}
function load(autoplay,index=0){
  if(!ready){pending={autoplay,index};return}
  if(station.isLiked&&!liked.length)return;
  const fn=autoplay?"loadPlaylist":"cuePlaylist";
  if(autoplay)started=true;
  if(station.isLiked)player[fn]([...liked],index);else player[fn]({list:station.list,listType:"playlist",index});
  waitList();
}
let wt;function waitList(){
  clearTimeout(wt);let n=0;
  const tick=()=>{const p=player.getPlaylist&&player.getPlaylist();
    if(p&&p.length){ids=p;renderList();player.setShuffle(shuffle);player.setLoop(true);return}
    if(++n<48)wt=setTimeout(tick,250);
    else if(!ids.length){$("count").textContent="";$("list").innerHTML=`<li class="empty">This playlist isn't available right now. Try another one.</li>`}};
  tick();
}
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player("yt",{width:"200",height:"200",
    playerVars:{playsinline:1,rel:0,controls:0,disablekb:1,iv_load_policy:3,fs:0,origin:location.origin},
    events:{
      onReady(){ready=true;player.setVolume(+$("vol").value);if(pending){const p=pending;pending=null;load(p.autoplay,p.index)}},
      onStateChange(e){
        const S=YT.PlayerState;
        if(e.data===S.PLAYING){started=true;setPlaying(true);showNow()}
        else if(e.data===S.PAUSED)setPlaying(false);
        else if(e.data===S.ENDED)setPlaying(false);
        else if(e.data===S.BUFFERING||e.data===S.CUED)showNow();
      },
      onError(){toast("Skipping a song that can't play here");setTimeout(()=>player.nextVideo(),600)}
    }});
};
(function(){const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>toast("Couldn't reach YouTube. Check your internet and refresh.");document.head.appendChild(s)})();

/* progress */
let seeking=false;
setInterval(()=>{
  if(!ready||!player.getDuration)return;
  const d=player.getDuration()||0,c=player.getCurrentTime()||0,p=d?c/d*100:0;
  if(!seeking){$("seek").value=Math.round(p*10);$("seek").style.setProperty("--p",p+"%")}
  $("tCur").textContent=fmt(c);$("tDur").textContent=fmt(d);
},500);
$("seek").addEventListener("input",e=>{seeking=true;e.target.style.setProperty("--p",e.target.value/10+"%")});
$("seek").addEventListener("change",e=>{seeking=false;if(ready)player.seekTo(player.getDuration()*e.target.value/1000,true)});
$("vol").addEventListener("input",e=>{e.target.style.setProperty("--p",e.target.value+"%");if(ready)player.setVolume(+e.target.value)});
$("vol").style.setProperty("--p","80%");

/* controls */
function togglePlay(){
  if(!ready)return toast("Getting the music ready…");
  if(!started){started=true;player.playVideo();return}
  isPlaying?player.pauseVideo():player.playVideo();
}
$("play").onclick=togglePlay;
$("next").onclick=()=>ready&&player.nextVideo();
$("prev").onclick=()=>{if(!ready)return;player.getCurrentTime()>4?player.seekTo(0,true):player.previousVideo()};
$("shuf").onclick=e=>{shuffle=!shuffle;const b=e.currentTarget;b.classList.toggle("on",shuffle);b.classList.toggle("dim",!shuffle);b.setAttribute("aria-pressed",shuffle);if(ready)player.setShuffle(shuffle);toast(shuffle?"Shuffle on":"Shuffle off")};
function toggleLike(id){
  if(!id)return;liked=liked.includes(id)?liked.filter(x=>x!==id):[...liked,id];store.set("osfm.liked",liked);
  const on=liked.includes(id);toast(on?"Saved to Liked ♥":"Removed from Liked");
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b=>{b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  if(id===curId){$("likeNow").classList.toggle("on",on);$("likeNow").setAttribute("aria-pressed",on)}
}
$("likeNow").onclick=()=>toggleLike(curId);
$("stations").onclick=e=>{const b=e.target.closest(".chip");if(b){selectStation(b.dataset.k,true);if(window.innerWidth<=900)document.querySelector(".player").scrollIntoView({behavior:"smooth",block:"start"})}};
$("list").addEventListener("click",e=>{
  const h=e.target.closest("[data-like]");if(h){toggleLike(h.dataset.like);return}
  const r=e.target.closest(".row");if(r&&r.dataset.i&&ready){started=true;player.playVideoAt(+r.dataset.i)}
});
$("list").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){e.preventDefault();e.target.click()}});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!/INPUT|BUTTON|LI/.test(e.target.tagName)){e.preventDefault();togglePlay()}});
if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",()=>ready&&player.playVideo());
  navigator.mediaSession.setActionHandler("pause",()=>ready&&player.pauseVideo());
  navigator.mediaSession.setActionHandler("nexttrack",()=>ready&&player.nextVideo());
  navigator.mediaSession.setActionHandler("previoustrack",()=>ready&&player.previousVideo());
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- Romantic bokeh background ---------- */
(function(){
  const c=$("bokeh"),x=c.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cols=["255,111,145","255,194,209","255,215,163","180,120,255","255,150,120"];
  let W,H,orbs=[];
  function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0)}
  function make(){const n=Math.round(Math.min(34,W*H/38000)+10);orbs=Array.from({length:n},()=>({
    x:Math.random()*W,y:Math.random()*H,r:6+Math.random()*Math.random()*70,c:cols[Math.random()*cols.length|0],
    a:.05+Math.random()*.22,vx:(Math.random()-.5)*.12,vy:-.05-Math.random()*.18,tw:Math.random()*6.28}))}
  function draw(t){
    x.clearRect(0,0,W,H);x.globalCompositeOperation="lighter";
    for(const o of orbs){
      if(!still){o.x+=o.vx;o.y+=o.vy;o.tw+=.01;if(o.y<-80){o.y=H+80;o.x=Math.random()*W}if(o.x<-80)o.x=W+80;if(o.x>W+80)o.x=-80}
      const a=o.a*(.75+.25*Math.sin(o.tw)),g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`rgba(${o.c},${a})`);g.addColorStop(.6,`rgba(${o.c},${a*.45})`);g.addColorStop(1,`rgba(${o.c},0)`);
      x.fillStyle=g;x.beginPath();x.arc(o.x,o.y,o.r,0,6.283);x.fill();
    }
    x.globalCompositeOperation="source-over";
    if(!still)requestAnimationFrame(draw);
  }
  size();make();draw();addEventListener("resize",()=>{size();make();if(still)draw()});
})();

/* start */
selectStation(store.get("osfm.station","90s"),false);
</script>
